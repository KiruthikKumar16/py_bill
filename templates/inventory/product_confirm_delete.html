{% extends 'inventory/base.html' %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<div class="page-header mb-4">
    <h1>Delete Product</h1>
    <p class="text-muted">Confirm removal of the selected product record.</p>
</div>
<div class="card card-body shadow-sm p-4">
    <div class="alert alert-warning mb-4">
        <h4 class="alert-heading">Delete Product</h4>
        <p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Yes, delete</button>
        <a class="btn btn-outline-secondary" href="{% url 'inventory:product_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
